<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curl Compass — Find Your Perfect Hair Routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FBF7F2;
    --bark: #3D2B1F;
    --bark-light: #6B4C3B;
    --gold: #C8943A;
    --gold-light: #F0C97A;
    --gold-pale: #FDF3E0;
    --rose: #C4776A;
    --sage: #7A9E8A;
    --sage-light: #EAF2EC;
    --white: #FFFFFF;
    --border: rgba(61,43,31,0.12);
    --border-strong: rgba(61,43,31,0.25);
    --text-muted: #8A7060;
    --radius: 16px;
    --radius-sm: 8px;
    --shadow: 0 2px 16px rgba(61,43,31,0.08);
    --shadow-lg: 0 8px 40px rgba(61,43,31,0.14);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--bark);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(251,247,242,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--bark);
    letter-spacing: -0.3px;
  }
  .nav-logo span { color: var(--gold); }
  .nav-badge {
    font-size: 12px;
    background: var(--gold-pale);
    color: var(--gold);
    border: 1px solid rgba(200,148,58,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 500;
  }

  /* SCREENS */
  .screen { display: none; animation: fadeUp 0.45s cubic-bezier(0.22,1,0.36,1); }
  .screen.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== HERO ===== */
  #screen-home {
    min-height: calc(100vh - 60px);
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 24px 80px;
    position: relative; overflow: hidden;
  }
  .hero-inner { max-width: 560px; margin: 0 auto; text-align: center; position: relative; z-index: 2; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: var(--gold);
    background: var(--gold-pale);
    border: 1px solid rgba(200,148,58,0.25);
    padding: 6px 14px; border-radius: 20px;
    margin-bottom: 28px;
  }
  .hero-eyebrow::before { content: '✦'; font-size: 10px; }
  .hero-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(38px, 7vw, 60px);
    line-height: 1.1;
    color: var(--bark);
    letter-spacing: -1px;
    margin-bottom: 20px;
  }
  .hero-title em { font-style: italic; color: var(--gold); }
  .hero-sub {
    font-size: 17px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto 40px;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--bark);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 500;
    padding: 16px 36px;
    border-radius: 50px;
    border: none; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
  }
  .btn-primary:hover { background: var(--bark-light); transform: translateY(-2px); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary svg { transition: transform 0.2s; }
  .btn-primary:hover svg { transform: translateX(4px); }
  .hero-stats {
    display: flex; gap: 32px; justify-content: center;
    margin-top: 56px;
    padding-top: 36px;
    border-top: 1px solid var(--border);
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; color: var(--bark);
    display: block;
  }
  .stat-label { font-size: 13px; color: var(--text-muted); }

  /* Decorative blobs */
  .blob {
    position: absolute; border-radius: 50%;
    pointer-events: none; z-index: 1;
  }
  .blob-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(200,148,58,0.12) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .blob-2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(196,119,106,0.1) 0%, transparent 70%);
    bottom: 0; left: -80px;
  }

  /* ===== QUIZ ===== */
  #screen-quiz {
    min-height: calc(100vh - 60px);
    display: flex; flex-direction: column;
    padding: 32px 24px 60px;
  }
  .quiz-inner { max-width: 580px; margin: 0 auto; width: 100%; }
  .quiz-progress-wrap {
    margin-bottom: 36px;
  }
  .quiz-progress-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
    font-size: 13px; color: var(--text-muted); font-weight: 500;
  }
  .quiz-progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .quiz-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--rose));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .quiz-q-num {
    font-size: 12px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 10px;
  }
  .quiz-q-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(22px, 4vw, 30px);
    line-height: 1.2;
    color: var(--bark);
    margin-bottom: 28px;
  }
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 36px;
  }
  .option-btn {
    display: flex; align-items: center; gap: 14px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 400;
    color: var(--bark);
    transition: border-color 0.18s, background 0.18s, transform 0.15s;
    position: relative;
  }
  .option-btn:hover {
    border-color: var(--gold);
    background: var(--gold-pale);
    transform: translateY(-2px);
  }
  .option-btn.selected {
    border-color: var(--gold);
    background: var(--gold-pale);
    font-weight: 500;
  }
  .option-btn.selected::after {
    content: '✓';
    position: absolute; right: 16px;
    color: var(--gold); font-weight: 600; font-size: 14px;
  }
  .option-icon {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 10px;
    background: var(--cream);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .quiz-nav {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
  }
  .btn-ghost {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    color: var(--bark-light);
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }
  .btn-ghost:hover { border-color: var(--bark); color: var(--bark); }
  .btn-next {
    flex: 1;
    background: var(--bark);
    color: var(--cream);
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s, transform 0.15s;
    opacity: 0.4;
    pointer-events: none;
  }
  .btn-next.enabled { opacity: 1; pointer-events: auto; }
  .btn-next.enabled:hover { background: var(--bark-light); transform: translateY(-1px); }

  /* ===== RESULTS ===== */
  #screen-results {
    padding: 40px 24px 80px;
  }
  .results-inner { max-width: 700px; margin: 0 auto; }
  .results-hero {
    text-align: center;
    padding: 40px 24px;
    background: var(--bark);
    border-radius: 24px;
    margin-bottom: 32px;
    position: relative; overflow: hidden;
  }
  .results-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 70% 30%, rgba(200,148,58,0.25) 0%, transparent 60%);
  }
  .results-badge {
    display: inline-block;
    background: rgba(200,148,58,0.2);
    border: 1px solid rgba(200,148,58,0.4);
    color: var(--gold-light);
    font-size: 12px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 16px; border-radius: 20px;
    margin-bottom: 16px;
    position: relative; z-index: 1;
  }
  .results-type {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(40px, 8vw, 64px);
    color: var(--cream);
    letter-spacing: -1px;
    margin-bottom: 8px;
    position: relative; z-index: 1;
  }
  .results-type-name {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(20px, 4vw, 28px);
    color: var(--gold-light);
    font-style: italic;
    margin-bottom: 12px;
    position: relative; z-index: 1;
  }
  .results-tagline {
    color: rgba(251,247,242,0.7);
    font-size: 15px;
    max-width: 400px;
    margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* Result sections */
  .section-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
  }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .section-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .icon-gold { background: var(--gold-pale); }
  .icon-sage { background: var(--sage-light); }
  .icon-rose { background: #FDF0EE; }
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--bark);
  }
  .routine-steps { list-style: none; }
  .routine-step {
    display: flex; gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .routine-step:last-child { border-bottom: none; padding-bottom: 0; }
  .step-num {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--bark);
    color: var(--cream);
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .step-content {}
  .step-name { font-weight: 500; color: var(--bark); margin-bottom: 3px; }
  .step-desc { font-size: 14px; color: var(--text-muted); line-height: 1.55; }
  .tips-grid { display: grid; gap: 12px; }
  .tip-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px;
    background: var(--cream);
    border-radius: var(--radius-sm);
  }
  .tip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .tip-text { font-size: 14px; color: var(--bark-light); line-height: 1.55; }
  .tip-text strong { color: var(--bark); font-weight: 500; }

  /* Products */
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .product-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .product-img {
    height: 140px;
    background: linear-gradient(135deg, var(--gold-pale) 0%, #F9EBD4 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    position: relative;
  }
  .product-badge {
    position: absolute; top: 10px; left: 10px;
    background: var(--sage);
    color: white;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 20px;
    text-transform: uppercase;
  }
  .product-body { padding: 14px; }
  .product-name { font-weight: 500; font-size: 14px; color: var(--bark); margin-bottom: 2px; line-height: 1.3; }
  .product-brand { font-size: 11px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .product-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }
  .btn-view {
    display: block; width: 100%;
    background: none;
    border: 1.5px solid var(--border-strong);
    border-radius: 8px;
    padding: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--bark);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background 0.18s, border-color 0.18s;
    /* AFFILIATE LINK PLACEHOLDER: replace href="#" with affiliate URL */
  }
  .btn-view:hover { background: var(--bark); color: var(--cream); border-color: var(--bark); }

  /* Result actions */
  .results-actions {
    display: flex; gap: 12px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .btn-save {
    flex: 1; min-width: 140px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--bark);
    color: var(--cream);
    border: none; border-radius: 50px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-save:hover { background: var(--bark-light); }
  .btn-restart {
    flex: 1; min-width: 140px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: none;
    border: 1.5px solid var(--border-strong);
    border-radius: 50px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    color: var(--bark);
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-restart:hover { border-color: var(--bark); background: var(--cream); }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--bark);
    color: var(--cream);
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px; font-weight: 500;
    white-space: nowrap;
    z-index: 1000;
    transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
    box-shadow: 0 4px 24px rgba(61,43,31,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Section label */
  .section-label {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--gold);
    margin-bottom: 16px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .hero-stats { gap: 20px; }
    .options-grid { grid-template-columns: 1fr; }
    .products-grid { grid-template-columns: repeat(2, 1fr); }
    .results-actions { flex-direction: column; }
    nav { padding: 0 16px; }
    #screen-home, #screen-results { padding-left: 16px; padding-right: 16px; }
    #screen-quiz { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 400px) {
    .products-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    .option-btn:hover, .btn-primary:hover { transform: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Curl<span>Compass</span></div>
  <div class="nav-badge">Free Tool</div>
</nav>

<!-- HOME SCREEN -->
<div id="screen-home" class="screen active">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">Personalized Hair Care</div>
    <h1 class="hero-title">Find Your <em>Perfect</em> Hair Routine</h1>
    <p class="hero-sub">Answer a few questions and get a personalized routine based on your hair type and goals — no experience needed.</p>
    <button class="btn-primary" onclick="startQuiz()">
      Start the Quiz
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-num">5</span>
        <span class="stat-label">Questions</span>
      </div>
      <div class="stat">
        <span class="stat-num">2 min</span>
        <span class="stat-label">To complete</span>
      </div>
      <div class="stat">
        <span class="stat-num">Free</span>
        <span class="stat-label">Always</span>
      </div>
    </div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="screen-quiz" class="screen">
  <div class="quiz-inner">
    <div class="quiz-progress-wrap">
      <div class="quiz-progress-header">
        <span id="q-label">Question 1 of 5</span>
        <span id="q-pct">20%</span>
      </div>
      <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" id="progress-fill" style="width:20%"></div>
      </div>
    </div>
    <div id="quiz-body"></div>
    <div class="quiz-nav">
      <button class="btn-ghost" id="btn-back" onclick="goBack()">← Back</button>
      <button class="btn-next" id="btn-next" onclick="goNext()">Continue →</button>
    </div>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div id="screen-results" class="screen">
  <div class="results-inner" id="results-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  {
    id: 'pattern',
    label: 'Hair pattern',
    question: 'What best describes your hair pattern?',
    options: [
      { value: '3A', icon: '〰', label: '3A', desc: 'Loose, large spirals' },
      { value: '3B', icon: '🌀', label: '3B', desc: 'Medium, springy ringlets' },
      { value: '3C', icon: '🌿', label: '3C', desc: 'Tight, dense corkscrews' },
      { value: '4A', icon: '💫', label: '4A', desc: 'Defined S-pattern coils' },
      { value: '4B', icon: '✨', label: '4B', desc: 'Z-pattern, less definition' },
      { value: '4C', icon: '🌸', label: '4C', desc: 'Tightest coils, shrinkage' },
      { value: 'unsure', icon: '❓', label: 'Not sure', desc: "I'll find out!" },
    ]
  },
  {
    id: 'goal',
    label: 'Primary goal',
    question: 'What is your primary hair goal?',
    options: [
      { value: 'growth',    icon: '🌱', label: 'Hair growth',        desc: 'Longer, stronger hair' },
      { value: 'moisture',  icon: '💧', label: 'Moisture',           desc: 'Combat dryness' },
      { value: 'definition',icon: '🌀', label: 'Curl definition',    desc: 'Enhanced curl pattern' },
      { value: 'repair',    icon: '🔧', label: 'Damage repair',      desc: 'Restore & strengthen' },
      { value: 'general',   icon: '💚', label: 'General healthy hair',desc: 'Overall wellness' },
    ]
  },
  {
    id: 'protective',
    label: 'Protective styles',
    question: 'How often do you wear protective styles?',
    options: [
      { value: 'never',     icon: '🙅', label: 'Never',     desc: 'I wear my hair out' },
      { value: 'sometimes', icon: '🔄', label: 'Sometimes', desc: 'Occasionally' },
      { value: 'often',     icon: '✅', label: 'Often',     desc: 'Most of the time' },
    ]
  },
  {
    id: 'budget',
    label: 'Budget',
    question: 'What is your product budget?',
    options: [
      { value: 'low',    icon: '🪙', label: 'Under $20',  desc: 'Budget-friendly picks' },
      { value: 'mid',    icon: '💵', label: '$20 – $50',  desc: 'Mid-range options' },
      { value: 'high',   icon: '💎', label: '$50+',       desc: 'Premium products' },
    ]
  },
  {
    id: 'dryness',
    label: 'Dryness level',
    question: 'How often does your hair feel dry?',
    options: [
      { value: 'rarely',     icon: '😊', label: 'Rarely',     desc: 'Usually moisturized' },
      { value: 'sometimes',  icon: '😐', label: 'Sometimes',  desc: 'Hit or miss' },
      { value: 'frequently', icon: '😟', label: 'Frequently', desc: 'Almost always dry' },
    ]
  }
];

let current = 0;
let answers = {};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  // Short delay lets the browser paint the element before measuring its position,
  // then smooth-scrolls down to it instead of jumping to the top of the page.
  setTimeout(() => {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 30);
}

function startQuiz() {
  current = 0;
  answers = {};
  renderQuestion();
  showScreen('screen-quiz');
}

function renderQuestion() {
  const q = questions[current];
  const pct = Math.round(((current + 1) / questions.length) * 100);
  document.getElementById('q-label').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('q-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-back').style.display = current === 0 ? 'none' : 'flex';
  document.getElementById('btn-next').textContent = current === questions.length - 1 ? 'See My Results →' : 'Continue →';
  const nextBtn = document.getElementById('btn-next');
  nextBtn.classList.remove('enabled');

  const body = document.getElementById('quiz-body');
  body.innerHTML = `
    <div class="quiz-q-num">0${current + 1} / 0${questions.length}</div>
    <h2 class="quiz-q-title">${q.question}</h2>
    <div class="options-grid" id="options-grid"></div>
  `;

  const grid = document.getElementById('options-grid');
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[q.id] === opt.value ? ' selected' : '');
    btn.innerHTML = `<div class="option-icon">${opt.icon}</div><div><div style="font-weight:500">${opt.label}</div><div style="font-size:13px;color:var(--text-muted);margin-top:2px">${opt.desc}</div></div>`;
    btn.onclick = () => selectOption(q.id, opt.value, btn);
    grid.appendChild(btn);
  });

  if (answers[q.id]) {
    document.getElementById('btn-next').classList.add('enabled');
  }
}

function selectOption(qid, val, el) {
  answers[qid] = val;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btn-next').classList.add('enabled');
}

function goNext() {
  if (!document.getElementById('btn-next').classList.contains('enabled')) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    buildResults();
    showScreen('screen-results');
  }
}

function goBack() {
  if (current > 0) { current--; renderQuestion(); }
  else showScreen('screen-home');
}

/* =============================================================
   RECOMMENDATION ENGINE
   ---------------------------------------------------------------
   Scores every product in the database against the user's answers.
   Returns the top 6 best matches.

   SCORING RULES (feel free to adjust the point values):
     Goal match       → +10 pts  (most important)
     Hair type match  → +5  pts
     Budget match     → +3  pts
     Bonus: "general" goal always scores +2 (universally useful)
     Bonus: unsure hair type → all hair types score +3 (we include everything)

   To add products: paste into productDatabase above.
   Never edit this function when adding products.
   ============================================================= */
function getRecommendedProducts(answers) {
  const userGoal    = answers.goal      || "general";
  const userType    = answers.pattern   || "unsure";
  const userBudget  = answers.budget    || "mid";

  // Score each product in the database
  const scored = productDatabase.map(product => {
    let score = 0;

    // ── Goal matching (+10 for exact match, +2 if product covers "general") ──
    if (product.goals.includes(userGoal)) {
      score += 10;
    }
    // Products tagged "general" are always somewhat relevant
    if (product.goals.includes("general") && userGoal !== "general") {
      score += 2;
    }
    // When the user's own goal IS general, make it a full match
    if (userGoal === "general" && product.goals.includes("general")) {
      score += 8; // already got 10 above, this is intentionally not additive
    }

    // ── Hair type matching (+5 for exact match, +3 if unsure = all types eligible) ──
    if (userType === "unsure") {
      // "unsure" users benefit from all products — light bonus for all
      score += 3;
    } else if (product.hairTypes.includes(userType)) {
      score += 5;
    }

    // ── Budget matching (+3 for exact match) ──
    if (product.budget.includes(userBudget)) {
      score += 3;
    }

    // ── Bonus: extra points for dryness + moisture-focused products ──
    if (answers.dryness === "frequently" && product.goals.includes("moisture")) {
      score += 3;
    }

    // ── Bonus: protective style wearers benefit from repair/growth products ──
    if (answers.protective === "often" &&
        (product.goals.includes("repair") || product.goals.includes("growth"))) {
      score += 2;
    }

    return { product, score };
  });

  // Sort by score, highest first
  scored.sort((a, b) => b.score - a.score);

  // Deduplicate by category — try to surface variety (max 2 per category)
  const categoryCounts = {};
  const recommended = [];

  for (const { product } of scored) {
    const cat = product.category;
    categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;

    // Allow max 2 products per category, but always fill 6 slots
    if (categoryCounts[cat] <= 2) {
      recommended.push(product);
    }
    if (recommended.length >= 6) break;
  }

  // If still under 6 (edge case), fill from the rest of scored list
  if (recommended.length < 6) {
    const ids = new Set(recommended.map(p => p.id));
    for (const { product } of scored) {
      if (!ids.has(product.id)) {
        recommended.push(product);
        if (recommended.length >= 6) break;
      }
    }
  }

  return recommended;
}


/* =============================================================
   AFFILIATE LINK HANDLER
   ---------------------------------------------------------------
   Opens the product's own affiliateLink in a new tab.
   If the link is blank, shows a friendly "coming soon" message.
   When you paste real URLs into the database, buttons auto-work.
   ============================================================= */
function handleProduct(affiliateLink) {
  if (affiliateLink && affiliateLink.trim() !== "") {
    window.open(affiliateLink, "_blank", "noopener,noreferrer");
  } else {
    showToast("Affiliate link coming soon! 🔗");
  }
}

        { name: 'LOC or LCO method', desc: 'Apply leave-in conditioner → oil → cream (or swap oil and cream order based on your hair\'s preference).' },
        { name: 'Twist or braid out to style', desc: 'Twist or two-strand twist damp hair and let dry completely before unraveling for a defined style.' },
      ],
      moistureTips: [
        { icon: '🫙', text: '<strong>Seal with butter:</strong> Shea or mango butter seals moisture better than liquid products alone — use as your final step.' },
        { icon: '💦', text: '<strong>Hydrate daily:</strong> Lightly mist hair with water every morning and follow with a tiny amount of oil to seal.' },
        { icon: '🧢', text: '<strong>Satin is essential:</strong> Sleep on a satin pillowcase or use a satin bonnet every night to reduce moisture loss.' },
        { icon: '🛁', text: '<strong>Steam treatments:</strong> Once a month, steam your deep conditioner in for 20 minutes — heat opens the cuticle for deeper hydration.' },
      ]
    };
  }

  // --- Routine C: 4C or growth-focused ---
  return {
    typeCode: pattern === 'unsure' ? '4B–4C' : pattern,
    typeName: 'Tight Coils & Growth Focus',
    tagline: 'Your hair is dense, resilient, and beautiful. It needs protection, patience, and consistent love.',
    washDay: [
      { name: 'Pre-poo with protein or oil', desc: 'Apply a protein treatment or heavy oil blend to dry hair the night before wash day. Cover with a plastic cap.' },
      { name: 'Shampoo in sections', desc: 'Divide hair into 4–6 sections. Shampoo each section individually to prevent tangling and breakage.' },
      { name: 'Protein then moisture deep condition', desc: 'Alternate between protein treatments and moisturizing deep conditioners each wash to maintain the moisture-protein balance.' },
      { name: 'Detangle with care', desc: 'Only detangle while hair has conditioner in it. Use a wide-tooth comb or Denman brush, always from ends to roots.' },
      { name: 'LCO method', desc: 'Apply leave-in first, then curl cream to coat the strand, then seal with a heavy oil or butter (castor oil is great for 4C).' },
      { name: 'Protective style to stretch', desc: 'Stretch hair in twists or braids while drying to reduce shrinkage and minimize single-strand knots.' },
    ],
    moistureTips: [
      { icon: '🌿', text: '<strong>Castor oil seal:</strong> Jamaican black castor oil is a 4C staple — apply to your scalp weekly to promote growth and seal moisture into ends.' },
      { icon: '🛡️', text: '<strong>Protective styles:</strong> Wear braids, twists, or updos to protect ends and reduce daily manipulation. Give your hair a break!' },
      { icon: '📅', text: '<strong>Consistent schedule:</strong> Wash every 1–2 weeks. Consistency matters more than perfection — your hair thrives on routine.' },
      { icon: '✂️', text: '<strong>Trim every 8–12 weeks:</strong> Regular trims prevent split ends from traveling up the strand and causing more breakage.' },
    ]
  };
}

function restartQuiz() {
  current = 0; answers = {};
  startQuiz();
}

function saveResults() {
  const data = {
    date: new Date().toLocaleDateString(),
    answers,
  };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'curl-compass-results.txt';
    a.click(); URL.revokeObjectURL(url);
    showToast('Results saved!');
  } catch(e) {
    // Fallback: print page
    window.print();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
